<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁版線性規劃計算器 (LP Calculator)</title>
  <!-- 引入開源線性規劃求解引擎 javascript-lp-solver -->
  <script src="https://unpkg.com/javascript-lp-solver/prod/solver.js"></script>
  <style>
    :root {
      --primary: #1F4E79;
      --primary-hover: #153654;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #dcdfe6;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "微軟正黑體", sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 24px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: var(--primary); text-align: center; margin-top: 0; font-size: 26px; }
    .section { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 17px; font-weight: bold; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; justify-content: space-between; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    label { font-weight: 600; font-size: 14px; }
    input[type="number"], input[type="text"], select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none;
    }
    input[type="number"] { width: 90px; }
    button {
      padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: var(--danger); color: white; padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #6c757d; color: white; }
    .math-preview {
      background: #eef3f8; padding: 14px; border-radius: 8px; font-family: "Courier New", Courier, monospace; font-size: 15px; color: #112a42; white-space: pre-wrap; line-height: 1.6;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: center; font-size: 14px; }
    th { background: #f8f9fa; color: var(--primary); }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-binding { background: #f8d7da; color: #721c24; }
    .badge-nonbinding { background: #d4edda; color: #155724; }
    .result-box {
      background: #f8f9fa; border-left: 5px solid var(--primary); padding: 16px; border-radius: 8px; margin-top: 16px; display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 網頁版線性規劃計算器 (LP Calculator)</h1>

  <!-- 範本快選 (加分項: 管理科學模型範本) -->
  <div class="section" style="background:#e8f4fd; padding:12px; border-radius:8px; border:none;">
    <span style="font-weight:bold; color:var(--primary);">💡 快速載入管理案例範本：</span>
    <button class="btn-secondary" onclick="loadExample(1)">作業指引範例 (2變數/2限制式)</button>
    <button class="btn-secondary" onclick="loadExample(2)">咖啡店營運決策 (產能配置)</button>
  </div>

  <!-- 1. 問題基本設定 -->
  <div class="section">
    <div class="section-title">1. 基本設定</div>
    <div class="row">
      <label>目標類型：</label>
      <select id="probType" onchange="updateMathPreview()">
        <option value="max">Maximization (最大化)</option>
        <option value="min">Minimization (最小化)</option>
      </select>
      <label style="margin-left: 15px;">變數數量：</label>
      <input type="number" id="numVars" value="2" min="1" max="10">
      <button class="btn-primary" onclick="initVariables()">更新變數欄位</button>
      <label style="margin-left: 15px;">
        <input type="checkbox" id="nonNegative" checked onchange="updateMathPreview()"> 限制所有變數為非負 (xᵢ ≥ 0)
      </label>
    </div>
  </div>

  <!-- 2. 目標函數 -->
  <div class="section">
    <div class="section-title">2. 目標函數 (Objective Function)</div>
    <div id="objContainer" class="row"></div>
  </div>

  <!-- 3. 限制式設定 -->
  <div class="section">
    <div class="section-title">
      3. 限制式 (Constraints)
      <button class="btn-success" onclick="addConstraintRow()">+ 新增限制式</button>
    </div>
    <div id="constraintsContainer"></div>
  </div>

  <!-- 4. 數學模型即時預覽 -->
  <div class="section">
    <div class="section-title">4. 數學模型預覽 (Mathematical Model)</div>
    <div id="mathModel" class="math-preview"></div>
  </div>

  <!-- 5. 求解動作 -->
  <div style="text-align:center; margin: 25px 0;">
    <button class="btn-primary" style="font-size:18px; padding:12px 40px;" onclick="solveLP()">🚀 開始求解 (Solve)</button>
  </div>

  <!-- 6. 求解結果與限制式分析 -->
  <div id="resultBox" class="result-box">
    <h3 style="color:var(--primary); margin-top:0;">🎯 求解最佳化結果</h3>
    <div id="statusOutput" style="font-size:16px; margin-bottom:12px;"></div>
    <div id="optimalValues" style="font-size:15px; margin-bottom:12px;"></div>
    
    <h4 style="margin-bottom:8px;">📌 限制式分析 (Binding / Slack 分析)</h4>
    <table id="constraintTable">
      <thead>
        <tr>
          <th>限制式</th>
          <th>左側值 (LHS)</th>
          <th>符號</th>
          <th>右側值 (RHS)</th>
          <th>鬆弛量 (Slack / Surplus)</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h4 style="margin-bottom:8px; margin-top:20px;">💼 管理決策解讀</h4>
    <div id="managementInsight" style="line-height:1.6; font-size:14px; background:white; padding:12px; border-radius:6px; border:1px solid var(--border);"></div>
  </div>
</div>

<script>
  let varCount = 2;

  // 初始化變數輸入欄位
  function initVariables(customWeights = null) {
    varCount = parseInt(document.getElementById('numVars').value) || 2;
    const objContainer = document.getElementById('objContainer');
    objContainer.innerHTML = '<span style="font-weight:bold; font-size:16px;">Z = </span>';

    for (let i = 1; i <= varCount; i++) {
      const weight = customWeights && customWeights[i-1] !== undefined ? customWeights[i-1] : 0;
      objContainer.innerHTML += `
        <div style="display:inline-flex; align-items:center; gap:4px;">
          <input type="number" id="c_${i}" value="${weight}" onchange="updateMathPreview()">
          <span>x<sub>${i}</sub></span>
          ${i < varCount ? '<span>+</span>' : ''}
        </div>
      `;
    }
    renderConstraintRows();
    updateMathPreview();
  }

  // 渲染/重置所有限制式的變數欄位
  function renderConstraintRows() {
    const container = document.getElementById('constraintsContainer');
    const rows = container.getElementsByClassName('constraint-row');
    for (let row of rows) {
      const rowId = row.dataset.id;
      const inputsDiv = row.querySelector('.var-inputs');
      let html = '';
      for (let i = 1; i <= varCount; i++) {
        html += `
          <input type="number" class="con-var" data-var="${i}" value="0" onchange="updateMathPreview()">
          <span>x<sub>${i}</sub></span>
          ${i < varCount ? '<span>+</span>' : ''}
        `;
      }
      inputsDiv.innerHTML = html;
    }
  }

  // 新增一條限制式
  function addConstraintRow(values = null, sign = '<=', rhs = 0) {
    const container = document.getElementById('constraintsContainer');
    const rowId = Date.now() + Math.random().toString(16).slice(2);
    const div = document.createElement('div');
    div.className = 'row constraint-row';
    div.dataset.id = rowId;

    let varInputsHtml = '';
    for (let i = 1; i <= varCount; i++) {
      const val = values && values[i-1] !== undefined ? values[i-1] : 0;
      varInputsHtml += `
        <input type="number" class="con-var" data-var="${i}" value="${val}" onchange="updateMathPreview()">
        <span>x<sub>${i}</sub></span>
        ${i < varCount ? '<span>+</span>' : ''}
      `;
    }

    div.innerHTML = `
      <div class="var-inputs" style="display:inline-flex; align-items:center; gap:4px;">${varInputsHtml}</div>
      <select class="con-sign" onchange="updateMathPreview()">
        <option value="<=" ${sign === '<=' ? 'selected' : ''}>&le;</option>
        <option value=">=" ${sign === '>=' ? 'selected' : ''}>&ge;</option>
        <option value="=" ${sign === '=' ? 'selected' : ''}>=</option>
      </select>
      <input type="number" class="con-rhs" value="${rhs}" onchange="updateMathPreview()">
      <button class="btn-danger" onclick="this.parentElement.remove(); updateMathPreview();">刪除</button>
    `;
    container.appendChild(div);
    updateMathPreview();
  }

  // 即時更新數學模型文字
  function updateMathPreview() {
    const type = document.getElementById('probType').value;
    let modelText = `${type.toUpperCase()} Z = `;
    
    let objTerms = [];
    for (let i = 1; i <= varCount; i++) {
      const c = document.getElementById(`c_${i}`)?.value || 0;
      objTerms.push(`${c}x${i}`);
    }
    modelText += objTerms.join(' + ') + '\n\nSubject to:\n';

    const rows = document.querySelectorAll('.constraint-row');
    if (rows.length === 0) {
      modelText += "  (尚未建立限制式)\n";
    } else {
      rows.forEach((row, idx) => {
        let terms = [];
        const inputs = row.querySelectorAll('.con-var');
        inputs.forEach(input => {
          terms.push(`${input.value}x${input.dataset.var}`);
        });
        const sign = row.querySelector('.con-sign').value;
        const rhs = row.querySelector('.con-rhs').value;
        modelText += `  ${terms.join(' + ')} ${sign} ${rhs}\n`;
      });
    }

    if (document.getElementById('nonNegative').checked) {
      let xList = [];
      for (let i = 1; i <= varCount; i++) xList.push(`x${i}`);
      modelText += `  ${xList.join(', ')} >= 0\n`;
    }

    document.getElementById('mathModel').innerText = modelText;
  }

  // 執行求解演算法 (使用 javascript-lp-solver)
  function solveLP() {
    if (typeof solver === 'undefined') {
      alert("求解器引擎載入中或未連線，請檢查網路連線後重試！");
      return;
    }

    const type = document.getElementById('probType').value; // max or min
    const isNonNegative = document.getElementById('nonNegative').checked;

    // 建立 solver 模型物件
    const model = {
      optimize: "Z",
      opType: type,
      constraints: {},
      variables: {}
    };

    // 1. 初始化變數
    for (let i = 1; i <= varCount; i++) {
      const varName = `x${i}`;
      model.variables[varName] = { Z: parseFloat(document.getElementById(`c_${i}`).value) || 0 };
      if (isNonNegative) {
        // 設定 x_i >= 0
        model.constraints[`nonneg_${varName}`] = { min: 0 };
        model.variables[varName][`nonneg_${varName}`] = 1;
      }
    }

    // 2. 加入使用者設定的限制式
    const rows = document.querySelectorAll('.constraint-row');
    const constraintRecords = [];

    rows.forEach((row, idx) => {
      const conName = `c_${idx + 1}`;
      const sign = row.querySelector('.con-sign').value;
      const rhs = parseFloat(row.querySelector('.con-rhs').value) || 0;
      
      model.constraints[conName] = {};
      if (sign === '<=') model.constraints[conName].max = rhs;
      else if (sign === '>=') model.constraints[conName].min = rhs;
      else if (sign === '=') model.constraints[conName].equal = rhs;

      let lhsFormula = [];
      row.querySelectorAll('.con-var').forEach(input => {
        const vId = input.dataset.var;
        const val = parseFloat(input.value) || 0;
        model.variables[`x${vId}`][conName] = val;
        lhsFormula.push({ varId: vId, coef: val });
      });

      constraintRecords.push({
        id: conName,
        sign: sign,
        rhs: rhs,
        formula: lhsFormula
      });
    });

    // 3. 呼叫求解
    const results = solver.Solve(model);
    displayResults(results, constraintRecords);
  }
